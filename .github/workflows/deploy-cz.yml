name: Deploy HOPE to Czech server (production)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hope-cz-deployment
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hope_ci
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U hope -d hope_ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://hope:ci-only-not-a-production-secret@127.0.0.1:5432/hope_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.9
      - run: uv sync --frozen
      - run: uv run python scripts/init_env.py
      - run: uv run ruff check .
      - run: uv run python manage.py check
      - run: uv run python manage.py collectstatic --noinput
      - run: uv run pytest -q
      - run: uv run python manage.py makemigrations --check --dry-run
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Keep this existing environment name: its protected deployment secrets live here.
    environment: czech-standby
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Deploy exact release and keep production services running
        env:
          DEPLOY_HOST: ${{ secrets.CZ_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.CZ_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.CZ_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/hope_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/hope_deploy' EXIT
          git archive --format=tar.gz "$GITHUB_SHA" |
            ssh -i ~/.ssh/hope_deploy -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
              "root@$DEPLOY_HOST" "deploy $GITHUB_SHA"
