# Add these locations INSIDE the existing HTTPS server {} for the panel's domain.
# This is an include fragment, not a replacement for the panel/server config.
# First confirm /hope/ isn't already used. Keep existing panel/API/subscription locations.
location = /hope {
    return 308 /hope/;
}

location ^~ /hope/ {
    # Trailing slash removes /hope/ from upstream PATH_INFO.
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Invite/recovery URLs must not appear in access/error logs.
    access_log off;
    error_log /dev/null crit;
}
