services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hope
      POSTGRES_USER: hope
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Run scripts/init_env.py}
    volumes:
      - hope-db:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:15432:5432
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U hope -d hope"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hope:${LOCAL_DB_PASSWORD}@db:5432/${APP_DATABASE_NAME:-hope}
    ports:
      - 127.0.0.1:8000:8000
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile /dev/null"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'X-Forwarded-Proto': 'https'}))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://hope:${LOCAL_DB_PASSWORD}@db:5432/${APP_DATABASE_NAME:-hope}
    command: [python, manage.py, runworker]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  bot:
    build: .
    profiles: [telegram]
    env_file: .env
    environment:
      DATABASE_URL: postgres://hope:${LOCAL_DB_PASSWORD}@db:5432/${APP_DATABASE_NAME:-hope}
    command: [python, manage.py, runbot]
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
volumes:
  hope-db:
